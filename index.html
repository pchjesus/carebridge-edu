<style>
:root{--bg:#f6f8fc;--panel:#fff;--ink:#18253b;--muted:#617087;--line:#dde5ef;--blue:#2357ce;--pale:#eef3ff;--teal:#0a8176;--palegreen:#e9f8f4;--orange:#a95b17;--paleorange:#fff5e8;--shadow:0 12px 35px rgba(24,42,76,.06);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);line-height:1.57}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:var(--blue)}:focus-visible{outline:3px solid #e3a332;outline-offset:3px}
.layout{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:26px 17px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:15px}.logo{display:flex;gap:10px;align-items:center;padding:7px 8px 21px}.mark{display:grid;place-items:center;border-radius:12px;width:42px;height:42px;background:var(--blue);color:white;font-weight:900;font-size:24px}.logo strong{display:block;line-height:1.1;font-size:18px;letter-spacing:-.5px}.logo small{color:var(--muted);font-size:12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);border-radius:11px;padding:13px 15px;font-weight:650}.nav button.active,.nav button:hover{background:var(--pale);color:var(--blue)}.sidefoot{margin-top:auto;border:1px solid var(--line);border-radius:12px;background:#fafcff;padding:13px;font-size:12px;color:var(--muted)}
.main{min-width:0}.topbar{height:75px;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);padding:0 34px;display:flex;justify-content:space-between;align-items:center;gap:12px}.topbar strong{font-size:15px}.tag{border-radius:100px;background:var(--pale);color:var(--blue);padding:5px 11px;font-size:12px;font-weight:750;white-space:nowrap}.tag.warn{background:var(--paleorange);color:var(--orange)}.content{max-width:1160px;padding:34px 34px 80px;margin:0 auto}.eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}h1{font-size:clamp(28px,3vw,39px);line-height:1.25;letter-spacing:-1.4px;margin:10px 0 12px}h2{font-size:23px;letter-spacing:-.6px;margin:0 0 15px}h3{font-size:17px;margin:0 0 8px;letter-spacing:-.3px}p{margin:0 0 12px;color:var(--muted)}.lead{font-size:16px;max-width:800px}.hero{padding:31px;border-radius:22px;background:linear-gradient(114deg,#edf3ff,#fff 64%,#eaf9f6);border:1px solid #dce6f6;margin-bottom:23px}.hero p{max-width:740px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:21px}.btn{background:var(--blue);color:white;border:1px solid var(--blue);border-radius:10px;padding:11px 16px;font-size:14px;font-weight:750;min-height:43px}.btn:hover:not(:disabled){filter:brightness(.94)}.btn.ghost{color:var(--blue);background:#fff;border-color:#bfcef1}.btn.subtle{background:#f4f7fd;color:#354b71;border-color:#dce5f3}.btn.small{font-size:12px;padding:8px 11px;min-height:35px}.btn.danger{color:#9e3037;background:#fff6f5;border-color:#f2cbcb}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:var(--panel);padding:22px;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);min-width:0}.card .num{font-size:30px;font-weight:850;letter-spacing:-1px;margin:5px 0;color:var(--ink)}.card .label{font-size:12px;color:var(--muted);font-weight:650}.section{margin-top:27px}.workflow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stepbox{border-radius:15px;background:#fff;border:1px solid var(--line);padding:20px}.stepnum{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--pale);color:var(--blue);font-weight:800;margin-bottom:12px}.small{font-size:13px;color:var(--muted)}.note{border-radius:12px;padding:14px 16px;background:#f5f8ff;border:1px solid #d7e3fa;color:#405372;font-size:13px}.note.amber{background:var(--paleorange);border-color:#f0d7b6;color:#85551d}.note.green{background:var(--palegreen);border-color:#c2e8de;color:#086b63}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:17px}.nurse-layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px}.patient-list{display:flex;flex-direction:column;gap:8px}.patient-row{border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%}.patient-row.selected{border-color:#8eaef6;background:#f2f6ff}.patient-row strong{font-size:14px}.muted{color:var(--muted)}.tiny{font-size:12px}.status{font-size:11px;font-weight:750;padding:4px 8px;border-radius:100px;background:#eff2f7;color:#58677b;white-space:nowrap}.status.progress{background:#eaf2ff;color:#2659c0}.status.review{background:#fff0d9;color:#95520d}.status.complete{background:#def5ea;color:#08754f}.group{margin:17px 0;padding-top:15px;border-top:1px solid var(--line)}.module{display:flex;gap:13px;padding:14px;border:1px solid var(--line);border-radius:10px;margin:9px 0;align-items:flex-start}.module input{width:19px;height:19px;accent-color:var(--blue);margin-top:2px}.module strong{display:block;font-size:14px}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info div{border-radius:10px;background:#f7f9fd;padding:11px 13px}.info span{display:block;color:var(--muted);font-size:11px}.info strong{font-size:14px}.field{display:block;margin:10px 0 6px;font-weight:700;font-size:13px}.textbox{width:100%;border:1px solid #cdd8e7;border-radius:9px;background:#fff;padding:12px;min-height:86px;resize:vertical;color:var(--ink)}.patient-stage{max-width:860px;margin:auto}.reader-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}.control-label{font-size:12px;font-weight:700;color:var(--muted)}.switches{display:flex;gap:5px;padding:4px;background:#edf1f8;border-radius:11px}.switches button{border:0;background:transparent;border-radius:8px;padding:7px 9px;color:#53637c;font-size:13px;min-height:36px}.switches button.selected{background:#fff;color:var(--blue);box-shadow:0 2px 7px #d2dced;font-weight:800}.reader{border:2px solid #dce7fa;border-radius:20px;background:#fff;padding:30px;min-height:285px}.reader.high{background:#111821;color:#fff;border-color:#3a4654}.reader.high p,.reader.high .small{color:#f4f5f7}.reader .reader-title{font-size:1.6em;font-weight:850;line-height:1.3;letter-spacing:-.8px;margin:4px 0 17px}.reader .reader-text{font-size:1.18em;line-height:1.9;white-space:pre-line;color:inherit}.reader .reader-kicker{font-size:.85em;color:var(--blue);font-weight:800}.reader.high .reader-kicker{color:#b8d4ff}.reader.f-large{font-size:20px}.reader.f-xlarge{font-size:24px}.progress-rail{height:9px;background:#e4eaf3;border-radius:99px;overflow:hidden;margin:8px 0 17px}.progress-rail span{display:block;height:100%;background:var(--teal);transition:width .15s}.answer-option{display:flex;align-items:center;gap:12px;border:1px solid #dbe3ef;border-radius:12px;padding:14px;margin:9px 0;cursor:pointer;font-size:15px}.answer-option:has(input:checked){border-color:#79a0ed;background:#edf3ff}.answer-option input{accent-color:var(--blue);width:20px;height:20px}.checkrow{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;margin:10px 0}.checkrow input{width:18px;height:18px;accent-color:var(--blue);margin-top:2px}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:16px}.evidence .card{height:100%}.citation{font-size:12px;color:var(--muted);margin:7px 0}.ideas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.idea{border:1px solid var(--line);border-radius:13px;background:#fff;padding:16px}.idea b{display:block;margin:0 0 6px}.list{padding-left:18px;color:var(--muted)}.list li{margin:6px 0}.footer{margin-top:35px;color:var(--muted);font-size:12px}.hide{display:none!important}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.sidebar{height:auto;position:static;padding:11px 20px;flex-direction:row;align-items:center;border-bottom:1px solid var(--line);border-right:0}.logo{padding:0}.nav{flex:1;flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;width:auto}.sidefoot{display:none}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.topbar{height:58px;padding:0 18px}.content{padding:22px 16px 60px}.sidebar{display:block;padding:12px}.logo{padding:0 5px 10px}.nav button{font-size:12px;padding:9px 11px}.hero{padding:22px}.cards,.workflow,.two-col,.nurse-layout,.info,.evidence,.ideas{grid-template-columns:1fr}.card{padding:18px}.reader{padding:19px}.reader.f-xlarge{font-size:21px}.topbar .tag{font-size:10px}.hero-actions .btn{flex:1}.nurse-layout{gap:11px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>
(function(){
"use strict";
var DATA=[
{id:"A",name:"환자 A",age:68,dept:"통원수술센터",phase:"입원",context:"수술 전 안내",modules:[
{id:"a1",title:"입원·병동 이용",text:"입원 중 궁금한 점이 있거나 도움이 필요하면 담당 간호사에게 알려주세요. 혼자 이동하기 어려울 때는 직원의 도움을 요청하세요.",ask:"도움이 필요할 때 누구에게 말씀하시겠어요?"},
{id:"a2",title:"수술·검사 준비",text:"검사와 수술 전 준비사항은 환자와 시술에 따라 달라집니다. 금식 시작 시각과 복용 중인 약의 조정 여부는 담당 의료진에게 개별적으로 확인하세요.",ask:"금식 시간이나 약에 관해 누구에게 확인하시겠어요?"},
{id:"a3",title:"입원 중 확인사항",text:"검사 일정이나 설명을 잘 이해하지 못했다면 다시 질문해 주세요. 이 안내만으로 수술 전 준비가 완료된 것은 아닙니다.",ask:"설명을 이해하지 못했을 때 어떻게 하시겠어요?"}]},
{id:"B",name:"환자 B",age:73,dept:"외과병동",phase:"퇴원",context:"퇴원 전 교육",modules:[
{id:"b1",title:"퇴원약 확인",text:"퇴원 시 제공받는 약의 이름, 복용 방법, 주의사항을 담당 간호사 또는 약사와 확인하세요. 임의로 약 복용 방법을 바꾸지 마세요.",ask:"약 복용 방법이 헷갈릴 때 어떻게 하시겠어요?"},
{id:"b2",title:"주의 증상과 문의",text:"수술 부위나 전신 상태에 관해 의료진이 안내한 이상 증상을 확인하세요. 증상 발생 시 안내받은 병원 연락처로 문의하고, 긴급한 상황에는 즉시 응급의료 도움을 받으세요.",ask:"의료진이 안내한 주의 증상이 생기면 어떻게 하시겠어요?"},
{id:"b3",title:"외래·개별 지시 확인",text:"외래 일정과 환자별 활동·식이·상처 관리 지침은 퇴원 전 담당 의료진과 확인하세요. 이 화면은 개별 처방을 대신하지 않습니다.",ask:"퇴원 전에 꼭 확인해야 할 개별 안내는 무엇인가요?"}]},
{id:"C",name:"환자 C",age:45,dept:"혈액종양내과",phase:"입원",context:"입원 기본 안내",modules:[
{id:"c1",title:"병동 이용 및 문의",text:"입원 중 불편함이나 궁금한 사항이 있으면 담당 간호사에게 알려주세요. 병동 이용 규칙은 병원 안내에 따라 확인하세요.",ask:"입원 중 질문이 생기면 어떻게 하시겠어요?"},
{id:"c2",title:"감염 관련 주의사항 확인",text:"손 위생 등 기본적인 감염 예방 행동에 관해 의료진의 안내를 받으세요. 환자별 감염 예방 조치는 치료 상태에 따라 다를 수 있으니 반드시 확인해야 합니다.",ask:"감염 예방에 관한 개인별 주의사항은 어디서 확인하시겠어요?"},
{id:"c3",title:"증상 및 검사 일정",text:"새로운 증상이나 몸 상태의 변화를 느끼면 즉시 담당 의료진에게 알리세요. 검사·치료 일정은 병동에서 개별 안내받으세요.",ask:"새로운 증상이 생기면 누구에게 말씀하시겠어요?"}]},
{id:"D",name:"환자 D",age:58,dept:"외과병동",phase:"퇴원",context:"복강경 담낭절제술 퇴원교육",featured:true,source:"MedlinePlus·NHS 공개 환자교육 자료를 한국어로 재구성",sourceUrl:"https://medlineplus.gov/ency/patientinstructions/000117.htm",materialUrl:"./materials/laparoscopic-cholecystectomy-discharge.html",modules:[
{id:"d1",title:"회복과 활동",text:"복강경 담낭절제술 후에는 회복 상태에 맞춰 가볍게 걷는 것부터 시작하고 활동을 조금씩 늘리세요. 무거운 물건 들기나 격한 운동을 다시 시작할 때는 담당 의료진에게 확인하세요. 움직일 때 통증이 심해지면 멈추고 상담하세요.",ask:"활동은 어떻게 다시 시작하고, 힘든 활동을 해도 되는 시점은 누구에게 확인하시겠어요?"},
{id:"d2",title:"상처 관리",text:"상처를 덮은 드레싱과 봉합 방법에 따라 샤워·교체 시점이 다르므로 퇴원 전에 간호사에게 확인하세요. 의료진이 허락하기 전까지 욕조에 몸을 담그거나 수영하지 마세요. 상처가 심하게 붉어지거나 뜨겁고, 고름처럼 보이는 분비물이 생기면 병원에 연락하세요.",ask:"상처가 붉고 뜨겁거나 분비물이 생기면 어떻게 하시겠어요?"},
{id:"d3",title:"식사와 배변",text:"회복기에는 균형 잡힌 식사를 하되 처음에는 소량씩 먹는 것이 편할 수 있습니다. 기름진 음식을 먹고 불편하다면 한동안 줄이는 방법을 의료진과 상의하세요. 묽은 변이 생길 수 있지만 오래 지속되거나 심하면 상담하세요.",ask:"식사 후 불편감이나 지속적인 설사가 있으면 어떻게 하시겠어요?"},
{id:"d4",title:"약 복용과 외래 일정",text:"복용할 약의 이름, 용법, 주의사항은 퇴원 시 처방전과 의료진의 설명을 기준으로 확인하세요. 임의로 약을 중단하거나 양을 바꾸지 마세요. 외래 방문 여부·일정과 병원 문의처는 퇴원 전에 꼭 확인하세요. 이 시연에는 실제 처방이나 예약 정보가 없습니다.",ask:"집에서 복용할 약과 외래 날짜를 어디에서 확인하실 건가요?"},

return '<div class="eyebrow">STEP 3 · NURSE REVIEW</div><h1>간호사 최종 이해 확인</h1><p class="lead">환자의 요청을 먼저 확인하고, 환자의 말로 주요 내용을 설명하도록 요청한 뒤 보충교육 여부를 판단하세요.</p>'
+'<div class="flow-steps"><span class="flow-step done">1 · 교육 설정</span><span class="flow-arrow">›</span><span class="flow-step done">2 · 환자 교육</span><span class="flow-arrow">›</span><span class="flow-step current">3 · 구두 이해 확인</span></div>'
+'<div class="nurse-layout"><section class="card"><h3>확인할 환자 선택</h3><div class="patient-list">'+DATA.map(function(x){return '<button class="patient-row '+(state.active===x.id?"selected":"")+'" data-patient="'+x.id+'"><span><strong>'+x.name+'</strong><br><span class="tiny muted">'+x.dept+' · '+x.phase+'</span></span>'+badge(state.progress[x.id].status)+'</button>'}).join('')+'</div><div class="group note">환자가 응답을 완료해야 최종 확인 버튼을 사용할 수 있어요.</div></section>'
+'<section class="card"><div class="row between"><div><h2>'+p.name+' · 교육 결과</h2><div class="small">'+mods.length+'개 교육 항목 중 '+Object.keys(pr.answers).length+'개 응답 · 재설명 요청 '+asked.length+'개</div></div>'+badge(pr.status)+'</div>'
+(asked.length?'<div class="note amber" style="margin-top:10px"><strong>다시 설명 요청:</strong> '+asked.map(function(m){return m.title}).join(', ')+'</div>':'')
+(pr.question?'<div class="note" style="margin-top:8px"><strong>환자 질문:</strong> '+esc(pr.question)+'</div>':'')
+'<div class="group"><div class="row between"><h3>Teach-back 확인 체크리스트</h3><span class="tag">간호사가 구두 확인</span></div>'
+mods.map(function(m){var v=pr.answers[m.id];return '<label class="checkrow"><input type="checkbox" class="teachcheck" value="'+m.id+'" '+(pr.verified?"checked":"")+'><span><strong>'+m.title+'</strong> <span class="status '+(v==="again"?"review":"")+'">'+(v==="again"?"재설명 요청":v==="yes"?"이해했다고 응답":"미응답")+'</span><br><span class="small">'+m.ask+'</span></span></label>'}).join('')
+'<label class="field" for="nurse-note">확인·보충교육 메모 (현재 시연 화면에만 보관)</label><textarea class="textbox" id="nurse-note" rows="2" placeholder="실제 환자정보 입력 금지">'+esc(state.notes[p.id])+'</textarea></div>'
+'<div class="row between"><div class="small">교육 상태를 선택하세요.</div><div class="row"><button class="btn ghost" data-action="needs" '+(!pr.completed?"disabled":"")+'>추가 설명 필요</button><button class="btn" data-action="verify" '+(!pr.completed||!mods.length||missing.length?"disabled":"")+'>구두 확인 완료로 표시 →</button></div></div><p class="small" id="review-validation" role="status" aria-live="polite"></p>'
+'<div class="note amber" style="margin-top:9px">체크는 과제 시연 기능이며 임상 기록이 아닙니다. 의료진 대면 확인 및 병원 승인 절차를 대체하지 않습니다.</div></section></div>'+footer();
}
function about(){
var ideas=[["교육 모듈 조합","공통·진료과·상황별 교육을 조합하여 누락 위험을 낮추도록 설계"],["환자 맞춤형 화면","큰 글씨·고대비·음성 속도 설정을 환자가 직접 조절"],["한 번에 한 주제","카드형 단계별 설명으로 인지적 부담을 줄이도록 구성"],["반복 듣기","음성 읽기·일시정지·재청취로 교육 보조"],["이해 여부 자기 점검","모르는 항목·질문을 간호사에게 전달"],["간호사 Teach-back","환자의 말로 설명하도록 요청하고 간호사가 직접 확인"],["교육 진행 현황","대기·진행·확인 필요 등 상태를 한눈에 표시"],["승인자료 관리 (후속)","병원 승인 교육자료와 개정 이력 관리, 실제 구현 전 검토"]];
var tabs='<div class="about-tabs" role="tablist" aria-label="아이디어와 근거 보기"><button class="about-tab '+(state.aboutTab==="ideas"?"active":"")+'" data-about="ideas" role="tab" aria-selected="'+(state.aboutTab==="ideas")+'">아이디어</button><button class="about-tab '+(state.aboutTab==="roadmap"?"active":"")+'" data-about="roadmap" role="tab" aria-selected="'+(state.aboutTab==="roadmap")+'">기능 우선순위</button><button class="about-tab '+(state.aboutTab==="evidence"?"active":"")+'" data-about="evidence" role="tab" aria-selected="'+(state.aboutTab==="evidence")+'">근거·한계</button></div>';
var h='<div class="eyebrow">WORKSHEET · STEP 3</div><h1>아이디어와 설계 근거</h1><p class="lead">3조 문제정의 워크시트와 디자인 시연을 연결한 자료예요. 조원 의견에 따라 브레인라이팅 목록을 확장할 수 있습니다.</p>'
+'<section class="card"><div class="eyebrow">HOW MIGHT WE?</div><p style="font-weight:750;font-size:16px;color:var(--ink);margin:8px 0 3px">어떻게 하면 입·퇴원 교육을 반복하는 간호사의 부담을 줄이면서도, 환자별 주의사항을 빠짐없이 전달하고 실제 이해 여부를 확인할 수 있을까?</p></section>'+tabs;
if(state.aboutTab==="ideas")h+='<section class="ideas" role="tabpanel">'+ideas.map(function(a,i){return '<div class="idea"><b>'+(i+1)+'. '+a[0]+'</b><div class="small">'+a[1]+'</div></div>'}).join('')+'</section><div class="note" style="margin-top:12px">조원 의견을 추가할 수 있는 초기 브레인라이팅 초안입니다. 교육 효과가 확인되었다는 뜻은 아닙니다.</div>';
if(state.aboutTab==="roadmap")h+='<section class="card" role="tabpanel"><h2>기능 우선순위</h2><div class="idea"><b>P0 · 현재 동작</b><div class="small">환자·교육 모듈 선택, 음성·접근성 설정, 환자 이해 여부 응답, 간호사 구두 확인, 진행 상태 표시</div></div><div class="idea" style="margin-top:9px"><b>P1 · 다음 개발 후보</b><div class="small">교육 승인·개정 관리, 인쇄 및 보호자 안내, 다국어 안내, 사용성 테스트, 교육자료 콘텐츠 검토</div></div><div class="idea" style="margin-top:9px"><b>P2 · 실제 기관 도입 검토</b><div class="small">EMR 연동, 권한관리·로그, 민감정보 보안·개인정보 보호, 환자별 공식 처방 연동</div></div></section>';
if(state.aboutTab==="evidence")h+='<section class="evidence" role="tabpanel"><div class="card"><span class="tag">문헌 기반 설계 원칙</span><h3 style="margin-top:11px">쉽게 설명하고, 실제 이해를 확인</h3><p class="small">AHRQ의 건강정보 이해능력 지침은 이해하기 쉬운 자료와 Teach-back을 통해 환자가 이해한 내용을 확인하는 접근을 안내합니다.</p><p class="small">CDC Clear Communication Index는 핵심 메시지, 쉬운 문구, 읽기 쉬운 자료 구조 등을 강조합니다.</p><div class="citation"><a target="_blank" rel="noopener noreferrer" href="https://www.ahrq.gov/health-literacy/improve/precautions/toolkit.html">AHRQ Health Literacy Toolkit ↗</a></div><div class="citation"><a target="_blank" rel="noopener noreferrer" href="https://www.ahrq.gov/health-literacy/improve/precautions/tool5.html">AHRQ Teach-back Tool ↗</a></div></div><div class="card"><span class="tag warn">미검증 기대효과</span><h3 style="margin-top:11px">프로그램 자체의 효과는 검증 전</h3><p class="small">간호사 반복 설명시간·업무 부담 감소, 교육 내용 누락 감소, 환자 이해도 향상은 기대효과이며 실측·대조 연구가 없습니다.</p><div class="note amber">실제 임상 적용에는 기관 교육자료 승인, 안전성·개인정보 보호 검토, 접근성 및 사용성 평가가 필요합니다.</div><div class="citation" style="margin-top:9px"><a target="_blank" rel="noopener noreferrer" href="https://www.cdc.gov/ccindex/">CDC Clear Communication Index ↗</a></div></div></section>';
return h+footer();
}

function showHelp(){
var old=document.getElementById("guide-overlay");if(old)old.remove();
var box=document.createElement("div");box.className="overlay";box.id="guide-overlay";
box.innerHTML='<div class="dialog" role="dialog" aria-modal="true" aria-label="CareBridge EDU 사용 안내"><div class="row between"><div><div class="eyebrow">QUICK GUIDE</div><h2>1분 사용 안내</h2></div><button class="btn small subtle" data-action="close-help" aria-label="사용 안내 닫기">✕ 닫기</button></div>'
+'<p>처음 사용한다면 순서대로 버튼을 눌러보세요.</p>'
+'<div class="guide-line"><span>1</span><div><b>간호사 · 환자와 교육 주제를 선택</b><p>의료진 메뉴에서 환자 A/B/C를 선택하고 교육 모듈을 체크해요.</p></div></div>'
+'<div class="guide-line"><span>2</span><div><b>환자 · 내용을 읽고 듣기</b><p>환자 교육 메뉴에서 글씨 크기·읽기 속도를 조절하고 다음 안내로 이동해요.</p></div></div>'
+'<div class="guide-line"><span>3</span><div><b>이해 확인 · 간호사가 마무리</b><p>환자가 재설명 요청을 표시하면 간호사가 직접 질문하고 구두 확인합니다.</p></div></div>'
+'<div class="note amber" style="margin-top:9px">이용자는 가상 환자만 선택할 수 있습니다. 실제 환자정보와 병원 처방을 입력하거나 적용하지 마세요.</div>'
+'<div class="row between" style="margin-top:17px"><button class="btn ghost" data-action="close-help">안내 닫기</button><button class="btn" data-action="help-start">의료진 화면 시작하기 →</button></div></div>';
document.body.appendChild(box);
box.querySelector('[data-action="close-help"]').focus();
}
function closeHelp(){var box=document.getElementById("guide-overlay");if(box)box.remove()}
function notify(message){
var prior=document.getElementById("ui-toast");if(prior)prior.remove();
var el=document.createElement("div");el.className="toast";el.id="ui-toast";el.setAttribute("role","status");el.textContent=message;document.body.appendChild(el);
setTimeout(function(){if(el.isConnected)el.remove()},2600);
}

function render(){
document.querySelectorAll(".nav button").forEach(function(b){var yes=b.getAttribute("data-nav")===state.page;b.classList.toggle("active",yes);if(yes)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
app.innerHTML=({home:home,nurse:nurse,patient:patientPage,review:review,about:about}[state.page]||home)();
app.classList.remove("page-enter");void app.offsetWidth;app.classList.add("page-enter");
}
function speak(){var p=patient(),mods=selectedModules(),m=mods[Math.min(state.index,mods.length-1)];if(!m)return;if(!("speechSynthesis" in window)){alert("현재 브라우저는 음성 읽기를 지원하지 않습니다.");return}stopSpeech();var u=new SpeechSynthesisUtterance(m.title+". "+m.text);u.lang="ko-KR";u.rate=state.speed;u.pitch=1;u.onend=function(){state.listening=false};u.onerror=function(){state.listening=false};window.speechSynthesis.speak(u);state.listening=true}
document.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;
if(b.dataset.nav){closeHelp();jump(b.dataset.nav);return}
if(b.dataset.patient){setPatient(b.dataset.patient);return}
if(b.dataset.font){state.font=b.dataset.font;render();return}
if(b.dataset.speed){state.speed=Number(b.dataset.speed);stopSpeech();render();return}
var a=b.dataset.action;
if(a==="toggle-sidebar"){state.collapsed=!state.collapsed;document.getElementById("shell").classList.toggle("is-collapsed",state.collapsed);b.setAttribute("aria-expanded",String(!state.collapsed));b.setAttribute("aria-label",state.collapsed?"사이드바 펼치기":"사이드바 접기");b.title=state.collapsed?"사이드바 펼치기":"사이드바 접기";return}
if(a==="show-help"){showHelp();return}
if(a==="close-help"){closeHelp();return}
if(a==="help-start"){closeHelp();jump("nurse");return}
if(b.dataset.about){state.aboutTab=b.dataset.about;render();return}
if(a==="demo-featured"){stopSpeech();state.active="D";var demo=state.progress.D;demo.status="progress";demo.completed=false;demo.verified=false;demo.answers={};demo.question="";state.index=0;state.phase="reading";jump("patient");return}
if(a==="demo-setup"){stopSpeech();state.active="D";state.phase="intro";jump("nurse");return}
if(a==="select-all"){state.selected[state.active]=patient().modules.map(function(m){return m.id});prog().answers={};prog().completed=false;prog().verified=false;prog().status="wait";state.phase="intro";render();notify("모든 교육 모듈을 선택했어요.");return}
if(a==="reset-demo"){DATA.forEach(function(p){state.selected[p.id]=p.modules.map(function(m){return m.id});state.progress[p.id]={status:"wait",answers:{},question:"",completed:false,verified:false};state.notes[p.id]=""});state.phase="intro";state.index=0;render();notify("가상 환자 시연 상태를 초기화했어요.");return}
if(!a)return;
var pr=prog(),mods=selectedModules();
if(a==="contrast"){state.contrast=!state.contrast;render()}
else if(a==="begin"||a==="start-reading"){if(!mods.length)return;pr.status="progress";pr.completed=false;pr.verified=false;pr.answers={};pr.question="";state.phase="reading";state.index=0;jump("patient")}
else if(a==="speak")speak();
else if(a==="pause-speech"){if("speechSynthesis" in window){if(window.speechSynthesis.paused)window.speechSynthesis.resume();else window.speechSynthesis.pause()}}
else if(a==="stop-speech")stopSpeech();
else if(a==="prev"){stopSpeech();state.index=Math.max(0,state.index-1);render()}
else if(a==="next"){stopSpeech();if(state.index<mods.length-1)state.index++;else state.phase="check";render()}
else if(a==="back-to-reading"){var q=document.getElementById("patient-question");if(q)pr.question=q.value;state.phase="reading";state.index=Math.max(0,mods.length-1);render()}
else if(a==="submit-check"){var q=document.getElementById("patient-question");if(q)pr.question=q.value;if(mods.some(function(m){return !pr.answers[m.id]})){var v=document.getElementById("validation");if(v)v.textContent="모든 교육 주제에 응답해 주세요.";return}pr.completed=true;pr.status="review";pr.verified=false;state.phase="finished";render();notify("간호사 구두 확인이 필요해요.")}
else if(a==="review-again"){pr.completed=false;pr.status="progress";pr.verified=false;state.phase="reading";state.index=0;render()}
else if(a==="needs"){if(!pr.completed)return;var note=document.getElementById("nurse-note");if(note)state.notes[patient().id]=note.value;pr.status="needs";pr.verified=false;render();notify("추가 설명이 필요한 상태로 표시했어요.")}
else if(a==="verify"){if(!pr.completed)return;var checks=Array.from(document.querySelectorAll(".teachcheck"));if(checks.some(function(c){return !c.checked})){var warn=document.getElementById("review-validation");if(warn)warn.textContent="각 교육 주제에 대한 구두 확인을 모두 완료한 후 표시해 주세요.";return}var note2=document.getElementById("nurse-note");if(note2)state.notes[patient().id]=note2.value;pr.status="verified";pr.verified=true;render();notify("간호사 구두 확인 완료로 표시했어요.")}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeHelp()});
document.addEventListener("click",function(e){if(e.target&&e.target.id==="guide-overlay")closeHelp()});
document.addEventListener("change",function(e){
var t=e.target;if(t.dataset.module){var id=t.dataset.module,items=state.selected[state.active];if(t.checked&&!items.includes(id))items.push(id);if(!t.checked)state.selected[state.active]=items.filter(function(x){return x!==id});prog().answers={};prog().completed=false;prog().verified=false;prog().status="wait";state.phase="intro";render()}
if(t.dataset.answer){prog().answers[t.dataset.answer]=t.value}
});
render();
})();
</script>
</body>
