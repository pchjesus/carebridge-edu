name: CareBridge EDU - Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: carebridge-edu-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static MVP
        run: |
          test -s index.html
          test -s assets/ui-v02.css
          node -e "const fs=require('fs');let s=fs.readFileSync('index.html','utf8');let js=s.match(/<script>([\s\S]*?)<\/script>/);if(!js)process.exit(1);new Function(js[1]);for(let k of ['data-nav=\"nurse\"','data-nav=\"patient\"','data-nav=\"review\"','ui-v02.css','toggle-sidebar','show-help','Teach-back'])if(!s.includes(k))throw Error('Missing '+k);console.log('MVP markup and JS syntax validated')"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/ui-v02.css _site/assets/ui-v02.css
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
